quarkus:
  application:
    name: jade-cart
    version: 1.0.0-SNAPSHOT

  http:
    # 8080 被 jade-ldap 容器占用, jade-cart 用 8090
    port: "${JADE_CART_HTTP_PORT:8090}"
    # CORS: Quarkus 内置 Vert.x 层过滤器 (jade-web 自定义 CorsFilter 已删除)。
    # 必须留在 HTTP 层: 安全层 401 也会带 CORS 头, 否则浏览器把过期 token 的
    # 401 拦截成 Network Error, 前端"登录已过期"提示失效
    cors:
      enabled: "${JADE_CORS_ENABLED:true}"
      # 127.0.0.1 与 localhost 是不同 Origin, 浏览器 POST 总带 Origin 且 vite 代理原样转发,
      # 白名单缺 127.0.0.1 时用该地址打开管理端会被 CORS 过滤器 403 (且无登录日志)。
      # 最后一条 /regex/ (Quarkus CORSFilter 约定: 斜杠包裹按正则解析) 放行 RFC1918 私网,
      # 支持局域网 IP 直接访问管理端 (vite host:true 广播的 Network 地址)。
      # 注意 origins 按逗号切分, 正则内严禁出现逗号 —— \d{1,3} 会被切碎, 量化一律用 [0-9]+
      # 生产域名 (teawone) 必须在列: 浏览器对同源 POST 也带 Origin, 缺失会被 CORS 过滤器 403
      origins: '${JADE_CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174,https://shop.teawone.com,http://shop.teawone.com,https://shop-admin.teawone.com,http://shop-admin.teawone.com,/https?:\/\/(localhost|127\.0\.0\.1|192\.168\.[0-9]+\.[0-9]+|10\.[0-9]+\.[0-9]+\.[0-9]+|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]+\.[0-9]+)(:[0-9]+)?/}'
      methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
      headers: accept,authorization,content-type,x-requested-with,x-trace-id,x-idempotency-key
      exposed-headers: x-trace-id
      access-control-max-age: 3600
      access-control-allow-credentials: true

  datasource:
    db-kind: postgresql
    username: "${DB_USERNAME:postgres}"
    password: "${DB_PASSWORD:postgres}"
    jdbc:
      url: "${DB_URL:jdbc:postgresql://localhost:5432/jade_cart?currentSchema=public}"
      max-size: 20
      min-size: 2
    devservices:
      enabled: false

  redis:
    hosts: "${REDIS_URL:redis://localhost:6380}"
    devservices:
      enabled: false

  hibernate-orm:
    database:
      generation: validate
    log:
      sql: false
    jdbc:
      timezone: Asia/Shanghai

  flyway:
    migrate-at-start: true
    # 多模块合并迁移: admin 自包含(V4~V8) + mail(V14) + ldap-client(V15) + cart 业务(V16+)
    locations: classpath:db/migration/${jade.db.vendor},classpath:com/jade/mail/db/migration/${jade.db.vendor},classpath:com/jade/ldapclient/db/migration/${jade.db.vendor},classpath:com/jade/cart/db/migration/${jade.db.vendor}
    baseline-on-migrate: true
    validate-on-migrate: false
    # 允许晚到的版本号插队 (多模块合并迁移必需)
    out-of-order: true

  smallrye-openapi:
    enable: true

  smallrye-health:
    root-path: /q/health

  micrometer:
    binder:
      jvm: true
      system: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 10ms,50ms,100ms,200ms,500ms,1s,2s,5s
    export:
      prometheus:
        path: /q/metrics

  log:
    level: INFO
    console:
      format: "%d{HH:mm:ss.SSS} %-5p [%X{traceId}] %c{1.} - %m%n"
    category:
      org.hibernate.orm.jdbc:
        level: WARN
      org.hibernate.engine.transaction:
        level: WARN
      io.netty:
        level: WARN
      io.vertx:
        level: WARN

mp:
  openapi:
    info:
      title: Jade Cart API
      version: 1.0.0-SNAPSHOT
      description: Jade Cart 电商系统 (管理端 + 店面 API)
  jwt:
    verify:
      issuer: jade-cart
      publickey:
        location: META-INF/jwt-public.pem

smallrye:
  jwt:
    sign:
      key:
        location: META-INF/jwt-private.pem
    new-token:
      issuer: jade-cart
      lifetime: 7200

jade:
  jwt:
    secret: "${JADE_JWT_SECRET:dev-only-change-me-in-prod-min-32-bytes-required!!}"
    expire-seconds: "${JADE_JWT_EXPIRE_SECONDS:7200}"
    issuer: "${JADE_JWT_ISSUER:jade-cart}"
  crypto:
    master-key: "${JADE_CRYPTO_MASTER_KEY:dev-only-aes-key-32-bytes-required-please!!}"
  db:
    vendor: "${JADE_DB_VENDOR:postgresql}"
  cart:
    # 店面 (Qute SSR) 配置
    store-name: "${JADE_CART_STORE_NAME:Jade Cart Store}"
    currency: "${JADE_CART_CURRENCY:USD}"
    # 店面语言注册表: CODE:Label 逗号分隔, 首个为默认 (翻资产 = classpath i18n/store_<code>.properties)
    locales: "${JADE_CART_LOCALES:en:English,de:Deutsch,fr:Français}"
    # 市场注册表: CODE:CURRENCY 逗号分隔 (P3-17, 当前经营市场用设置 KV market 切换)
    markets: "${JADE_CART_MARKETS:US:USD,EU:EUR}"
    # 未支付订单库存预留分钟数 (kartwo: 30)
    reservation-minutes: "${JADE_CART_RESERVATION_MINUTES:30}"

# ============ 测试 profile (P3-14): @QuarkusTest 自动启用, 独立库 jade_test ============
"%test":
  quarkus:
    datasource:
      jdbc:
        url: "${TEST_DB_URL:jdbc:postgresql://localhost:5432/jade_test?currentSchema=public}"
        max-size: 8
    redis:
      hosts: "redis://localhost:6380"
    http:
      test-port: 0
    flyway:
      migrate-at-start: true
  jade:
    cart:
      media-dir: "./target/test-media"
      backup-dir: "./target/test-backups"

"%dev":
  quarkus:
    dev-ui:
      enabled: false
    continuous-testing:
      enabled: DISABLED
    hibernate-orm:
      log:
        sql: true
    log:
      level: INFO
      category:
        org.hibernate.SQL:
          level: DEBUG
        org.hibernate.orm.jdbc.bind:
          level: TRACE

"%prod":
  quarkus:
    hibernate-orm:
      log:
        sql: false
  jade:
    jwt:
      secret: "${JADE_JWT_SECRET}"
      expire-seconds: "${JADE_JWT_EXPIRE_SECONDS}"
      issuer: "${JADE_JWT_ISSUER}"
    crypto:
      master-key: "${JADE_CRYPTO_MASTER_KEY}"

# ============ SQLite profile: QUARKUS_PROFILE=sqlite 启动 (同 jade-admin, 单文件库, 轻量部署) ============
# 注意 Quarkus profile 语义: 指定 named profile 后 %prod 段不激活, jwt/crypto 密钥沿用
# 顶层带默认值的定义, 生产务必用 JADE_JWT_SECRET/JADE_CRYPTO_MASTER_KEY 环境变量覆盖
"%sqlite":
  jade:
    db:
      vendor: sqlite
  quarkus:
    datasource:
      db-kind: sqlite
      jdbc:
        # WAL + busy_timeout 同底座默认; 连接池限 4 规避 SQLite 单写者锁竞争
        url: "${DB_URL:jdbc:sqlite:./data/jade_cart.db?journal_mode=WAL&busy_timeout=5000}"
        max-size: 4
        min-size: 1
    hibernate-orm:
      # 迁移脚本已完整建表; SQLite 方言下 validate 对类型映射易误报, 同底座用 none
      database:
        generation: none
      dialect: org.hibernate.community.dialect.SQLiteDialect
      log:
        sql: false
