{#storePage title=t.contactTitle store=storeName seo=seo t=t langs=langs theme=theme baseUrl=baseUrl pill=false navCats=navCats}

<nav class="crumb">
  <a href="/">{t.crumbHome}</a><span class="sep">›</span><span class="cur">{t.contactTitle}</span>
</nav>

<div class="contact-split">
  <div class="contact-intro">
    <h1>{t.contactTitle}</h1>
    <p>{t.contactIntro}</p>
    <a class="btn intro-btn" href="/products">{t.shopNow}</a>
  </div>
  <div class="contact-form-panel">
    {#if sent}
    <p class="ok">{t.sentOk}</p>
    {#else}
    {#if error}<div class="error">{error}</div>{/if}
    <form method="post" action="/contact">
      <div class="row2">
        <input type="text" name="name" placeholder="{t.phName}" aria-label="{t.phName}">
        <input type="email" name="email" required placeholder="{t.phEmail}" aria-label="{t.emailLabel}">
      </div>
      <textarea name="message" required rows="5" placeholder="{t.phComment}"></textarea>
      <!-- honeypot: 人类不可见, 机器人填写即丢弃 -->
      <input type="text" name="website" style="display:none" tabindex="-1" autocomplete="off">
      <button class="btn dark" type="submit">{t.send}</button>
    </form>
    {/if}
  </div>
</div>

{/storePage}
