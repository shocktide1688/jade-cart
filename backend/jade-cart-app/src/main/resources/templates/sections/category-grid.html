<section class="sec-cats">
  {#if cfg.title}<h2>{cfg.title}</h2>{/if}
  <div class="cat-grid">
    {#for c in categories}
    <a class="cat-card" href="/products?category={c.slug}">
      {#if c.cover}<img src="/media/{c.cover}?w=400" alt="{c.name}" loading="lazy">{#else}<div class="cat-ph">✦</div>{/if}
      <div class="cat-name">{c.name}</div>
    </a>
    {/for}
  </div>
</section>
