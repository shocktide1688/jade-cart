{#if cfg.href}
<a class="sec-banner" href="{cfg.href}" style="background:{#if cfg.bg}{cfg.bg}{#else}var(--c-primary){/if};color:#fff;display:block;text-align:center;padding:12px 20px;border-radius:var(--radius);margin-bottom:8px">{cfg.text}</a>
{#else}
<div class="sec-banner" style="background:{#if cfg.bg}{cfg.bg}{#else}var(--c-primary){/if};color:#fff;text-align:center;padding:12px 20px;border-radius:var(--radius);margin-bottom:8px">{cfg.text}</div>
{/if}
