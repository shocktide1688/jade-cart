server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 管理端 API / 媒体 / 健康 — 同源反代到后端 (与 Vite dev 代理一致)
    location /api/ {
        proxy_pass http://app:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /media/ {
        proxy_pass http://app:8090;
        proxy_set_header Host $host;
    }
    location /q/ {
        proxy_pass http://app:8090;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
